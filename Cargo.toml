[package]
name = "biogami"
version = "0.1.0"
edition = "2021"
description = "OSL (Origami Shape Language) interpreter, compiler, and cell-sheet simulator"

[lib]
path = "src/lib.rs"

[[bin]]
name = "bgcompile"
path = "src/bin/bgcompile.rs"

[[bin]]
name = "bgrun"
path = "src/bin/bgrun.rs"

[dependencies]
anyhow = "1"
thiserror = "1"
rand = "0.8"
rand_chacha = "0.3"
eframe = { version = "0.27", default-features = false, features = ["default_fonts", "glow"] }
egui = "0.27"

[profile.release]
opt-level = 3
lto = "thin"
